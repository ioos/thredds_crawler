[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm",
]

[project]
name = "thredds-crawler"
description = "Python interface for ERDDAPA Python library for crawling THREDDS servers"
readme = "README.md"
license = { file = "LICENSE.txt" }
maintainers = [
  { name = "Kyle Wilcox", email = "kyle@axiomdatascience.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [
  "version",
]
dependencies = [
  "lxml",
  "python-dateutil",
  "pytz",
  "requests",
]

[dependency-groups]
dev = [
  "netcdf4",
  "prek",
  "pytest",
]
urls.documentation = "https://ioos.github.io/thredds_crawler"
urls.homepage = "https://github.com/ioos/thredds_crawler"
urls.repository = "https://github.com/ioos/thredds_crawler"

[tool.setuptools]
packages = [
  "thredds_crawler",
]
include-package-data = true
dynamic.dependencies = { file = [
  "requirements.txt",
] }

[tool.setuptools_scm]
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
write_to = "thredds_crawler/_version.py"
write_to_template = "__version__ = '{version}'"

[tool.interrogate]
fail-under = 85
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
exclude = [
  "docs",
  "tests",
]
color = true
verbose = 1
quiet = false

[tool.check-manifest]
ignore = [
  ".coveragerc",
  "docs",
  "docs/*",
]

[tool.pytest]
ini_options.filterwarnings = [
  "error:::thredds_crawler.*",
  "ignore::UserWarning",
  "ignore::RuntimeWarning",
]
